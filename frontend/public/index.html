<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Frontend</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Hello Frontend</h1>
    <p>Statut backend :</p>
    <pre id="status">Chargement...</pre>
  </div>

  <script>
    fetch('/api/status')
      .then(res => res.json())
      .then(data => {
        document.getElementById('status').innerText = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Erreur backend : ' + err;
      });
  </script>
</body>
</html>
